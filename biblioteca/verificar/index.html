<!doctype html>
<html lang="es-419">
<head>
  <script>window.TR4_RUNTIME = {ready:false,teamPreview:false,analyticsEnabled:false,automationEnabled:false};</script>
  <script src="/api/genesis/config?format=js"></script>
  <script>if(window.TR4_RUNTIME.teamPreview){var manifest=document.createElement('link');manifest.rel='manifest';manifest.href='/api/genesis/manifest';document.head.appendChild(manifest);var icon=document.createElement('link');icon.rel='apple-touch-icon';icon.href='/biblioteca/icons/icon-192.png';document.head.appendChild(icon);}</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Validando acceso · Ruta Tr4iner</title>
  <link rel="canonical" href="https://metodo.tr4iner.com/biblioteca/verificar/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#FFFFFF; --surface:#FAFAFA; --ink:#111111; --ink-soft:#3F3F3F; --muted:#6B6B6B; --rule:rgba(17,17,17,.12); --mark:#FFD43B; --sans:"Instrument Sans",Arial,sans-serif; --mono:"JetBrains Mono",monospace; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { background:var(--paper); -webkit-text-size-adjust:100%; }
    body { min-width:320px; min-height:100dvh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:17px/1.55 var(--sans); padding:24px; -webkit-font-smoothing:antialiased; }
    .card { width:min(100%,560px); padding:clamp(32px,7vw,54px); text-align:center; }
    .mark { width:54px; height:5px; margin:0 auto 26px; border-radius:99px; background:var(--mark); }
    .kicker { color:var(--muted); font:600 10px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin-top:14px; font:750 clamp(34px,7vw,50px)/1 var(--sans); letter-spacing:-.052em; text-wrap:balance; }
    p { max-width:430px; margin:16px auto 0; color:var(--ink-soft); }
    .spin { width:28px; height:28px; margin:28px auto 0; border:3px solid var(--rule); border-top-color:var(--ink); border-radius:50%; animation:s .75s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:26px; }
    .actions a, .actions button { min-height:52px; display:inline-flex; align-items:center; justify-content:center; padding:13px 18px; border:1px solid var(--ink); border-radius:6px; background:var(--ink); color:var(--paper); font:700 17px/1.2 var(--sans); text-decoration:none; cursor:pointer; }
    .actions .secondary { background:transparent; color:var(--ink); }
    .actions a:focus-visible, .actions button:focus-visible { outline:3px solid var(--mark); outline-offset:3px; }
    /* El display de los botones le ganaba al atributo hidden. */
    [hidden] { display:none !important; }
    .error .spin { display:none; }
    @media (max-width:560px) { body { place-items:start center; padding:calc(72px + env(safe-area-inset-top)) 18px 32px; } .card { padding:0; } h1 { font-size:clamp(36px,10.5vw,44px); } .actions a, .actions button { width:100%; } }
    @media (prefers-reduced-motion:reduce) { .spin { animation-duration:1.5s; } }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="mark"></div>
    <p class="kicker">RUTA TR4INER</p>
    <h1 id="title">Validando tu acceso…</h1>
    <p id="message">Estamos abriendo tu expediente privado.</p>
    <div class="spin" aria-label="Cargando"></div>
    <div class="actions">
      <button id="again" type="button" hidden>Reintentar →</button>
      <a id="retry" href="/biblioteca/acceso/" hidden>Entrar con mi correo →</a>
    </div>
  </main>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(window.location.search);
      // El correo manda `?token=…`. El botón del WhatsApp no puede: WhatsApp
      // encodea lo que se le concatena al final de la URL del botón, así que un
      // `?` o una `/` llegan como %3F/%2F y el enlace muere. Por eso el WhatsApp
      // entra por `/r/<token>`: base64url no trae ningún carácter reservado.
      var fromPath = (window.location.pathname.match(/^\/r\/([A-Za-z0-9_-]+)\/?$/) || [])[1];
      var token = params.get('token') || fromPath || '';

      function copyAttribution(target) {
        params.forEach(function (value, key) {
          var isAttribution = /^utm_/i.test(key) ||
            /^(video|fbclid|gclid|fbc|fbp|fbc_id|h_ad_id|ttclid|msclkid|wbraid|gbraid|ctwa_clid)$/i.test(key);
          if (isAttribution && value) target.searchParams.set(key, value);
        });
      }
      function enterRoute(video) {
        // El punto de partida ya no bloquea la entrada: se entra siempre a la ruta.
        var next = new URL('/biblioteca/videos/', window.location.origin);
        copyAttribution(next);
        if (video) next.searchParams.set('video', video);
        window.location.replace(next.toString());
      }
      // «Load failed» (iPhone) o «Failed to fetch» (Chrome): la red se cortó a mitad de
      // camino. No es un enlace vencido, y ese texto en inglés no se le muestra a nadie
      // (16-oct: así le llegó a Anthoni dos veces seguidas).
      function corte() {
        var error = new Error('corte');
        error.corte = true;
        return error;
      }
      function esCorte(error) {
        return error instanceof TypeError || Boolean(error && error.corte);
      }
      function showError(message, cortado) {
        document.getElementById('card').classList.add('error');
        document.getElementById('title').textContent = cortado ? 'Se cortó la conexión.' : 'Este enlace ya no abre.';
        document.getElementById('message').textContent = cortado
          ? 'Tu enlace sigue sirviendo. Revisa tu señal y toca «Reintentar».'
          : message;
        var retry = document.getElementById('retry');
        var access = new URL('/biblioteca/acceso/', window.location.origin);
        copyAttribution(access);
        retry.href = access.toString();
        retry.classList.toggle('secondary', cortado);
        retry.hidden = false;
        document.getElementById('again').hidden = !cortado;
      }
      document.getElementById('again').addEventListener('click', function () { window.location.reload(); });
      // Los botones de bienvenida (correo y WhatsApp) no vencen desde el 19-oct; los reenvíos
      // viejos sí. Si uno de esos ya no abre pero la sesión de 30 días sigue viva, se entra
      // igual: no se manda al portón a quien ya está adentro.
      function fail(error) {
        var cortado = esCorte(error);
        var message = cortado ? '' : (error && error.message) || 'Entra con tu correo o tu teléfono.';
        fetch('/api/genesis/me').then(function (response) {
          if (response.ok) { enterRoute(params.get('video')); return; }
          showError(message, cortado);
        }).catch(function () { showError(message, true); });
      }
      function esperar(ms) {
        return new Promise(function (resolve) { window.setTimeout(resolve, ms); });
      }
      // Si la respuesta se pierde, el CRM ya abrió la sesión pero la cookie nunca llegó. El
      // mismo enlace vuelve a abrir (para siempre si es de bienvenida, unos minutos desde este
      // navegador si es un reenvío viejo), así que se pide otra vez antes de rendirse.
      function validar(intento) {
        return fetch('/api/genesis/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        }).then(function (response) {
          // Un 5xx o una página de error de Vercel tampoco dicen que el enlace venció.
          if (response.status >= 500) throw corte();
          return response;
        }).catch(function (error) {
          if (!esCorte(error) || intento >= 2) throw error;
          return esperar(intento ? 3000 : 1200).then(function () { return validar(intento + 1); });
        });
      }

      if (!token) { fail(new Error('Falta el código de acceso. Entra con tu correo o tu teléfono.')); return; }

      validar(0).then(function (response) {
        if (!response.ok) {
          return response.json().catch(function () { return {}; }).then(function (data) {
            throw new Error(data.error || 'El enlace venció.');
          });
        }
        return response.json().catch(function () { throw corte(); });
      }).then(function (verified) {
        return fetch('/api/genesis/me').then(function (response) {
          // Validó pero la cookie no quedó: reintentar con el mismo enlace la vuelve a dar.
          if (!response.ok) throw corte();
          return response.json();
        }).then(function () {
          enterRoute(verified.targetVideo || params.get('video'));
        });
      }).catch(fail);
    })();
  </script>
</body>
</html>
