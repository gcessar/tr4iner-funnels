<!doctype html>
<html lang="es-419">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F4EFE6" />
  <title>Validando acceso · GENESIS TR4INER</title>
  <link rel="canonical" href="https://metodo.tr4iner.com/biblioteca/verificar/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#F4EFE6; --card:#FFFDF6; --ink:#16130E; --muted:#766e60; --rule:rgba(22,19,14,.2); --mark:#F5C518; --serif:"Fraunces",Georgia,serif; --sans:"Instrument Sans",sans-serif; --mono:"JetBrains Mono",monospace; }
    *{box-sizing:border-box;margin:0;padding:0} body{min-height:100dvh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans);padding:24px}.card{width:min(100%,580px);border:1px solid var(--rule);background:var(--card);padding:clamp(28px,7vw,48px);text-align:center;box-shadow:0 20px 55px rgba(54,43,22,.12)}.mark{width:42px;height:5px;margin:0 auto 28px;background:var(--mark)}.kicker{color:var(--muted);font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase}h1{margin-top:12px;font:560 clamp(32px,7vw,48px)/1.05 var(--serif);letter-spacing:-.03em}p{margin-top:14px;color:#514a3e}.spin{width:25px;height:25px;margin:25px auto 0;border:2px solid rgba(22,19,14,.18);border-top-color:var(--ink);border-radius:50%;animation:s .75s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{display:inline-block;margin-top:22px;color:var(--ink);font-weight:700;text-underline-offset:4px}.error .spin{display:none}
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="mark"></div>
    <p class="kicker">TR4INER · GENESIS</p>
    <h1 id="title">Validando tu acceso…</h1>
    <p id="message">Estamos abriendo tu expediente privado.</p>
    <div class="spin" aria-label="Cargando"></div>
    <a id="retry" href="/biblioteca/acceso/" hidden>Pedir un enlace nuevo →</a>
  </main>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      function fail(message) {
        document.getElementById('card').classList.add('error');
        document.getElementById('title').textContent = 'Este enlace ya no abre.';
        document.getElementById('message').textContent = message;
        var retry = document.getElementById('retry');
        var access = new URL('/biblioteca/acceso/', window.location.origin);
        if (params.get('video')) access.searchParams.set('video', params.get('video'));
        retry.href = access.toString();
        retry.hidden = false;
      }
      if (!token) { fail('Falta el código de acceso. Solicita uno nuevo.'); return; }

      fetch('/api/genesis/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      }).then(function (response) {
        if (!response.ok) return response.json().then(function (data) { throw new Error(data.error || 'El enlace venció.'); });
        return response.json();
      }).then(function (verified) {
        return fetch('/api/genesis/me').then(function (response) {
          if (!response.ok) throw new Error('No se pudo abrir la sesión.');
          return response.json();
        }).then(function (session) {
          var video = verified.targetVideo || params.get('video');
          var path = session.member && session.member.hasPlan ? '/biblioteca/videos/' : '/biblioteca/plan/';
          var next = new URL(path, window.location.origin);
          if (video) next.searchParams.set('video', video);
          ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','fbc_id','h_ad_id'].forEach(function (key) {
            if (params.get(key)) next.searchParams.set(key, params.get(key));
          });
          window.location.replace(next.toString());
        });
      }).catch(function (error) { fail(error.message || 'Solicita un enlace nuevo.'); });
    })();
  </script>
</body>
</html>
