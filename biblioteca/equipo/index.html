<!doctype html>
<html lang="es-419">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#ffffff">
  <title>Acceso del equipo · Ruta Tr4iner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fafafa;color:#111;font-family:'Instrument Sans',sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:430px}.brand{font-weight:700;letter-spacing:-.08em;font-size:25px}.label{font:11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;margin-top:48px;color:#555}h1{font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-.055em;margin:14px 0 20px}p{line-height:1.55;color:#626262;font-size:16px}label{display:block;font-size:14px;font-weight:600;margin:32px 0 9px}input{width:100%;height:54px;border:1px solid #c9c9c9;border-radius:10px;padding:0 14px;font:16px 'Instrument Sans',sans-serif;background:#fff}input:focus{outline:2px solid #111;outline-offset:3px}button{margin-top:16px;min-height:54px;width:100%;border:0;border-radius:10px;background:#ffd43b;color:#111;font:600 16px 'Instrument Sans',sans-serif;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:2px solid #111;outline-offset:3px}#error{font-size:14px;color:#a92720;min-height:23px;margin:12px 0}.note{font-size:13px;margin-top:28px;border-top:1px solid #dedede;padding-top:20px}
  </style>
</head>
<body>
  <main>
    <div class="brand">TR4INER</div>
    <div class="label">Acceso privado del equipo</div>
    <h1>Prueba tu nueva<br>Ruta Tr4iner.</h1>
    <p>Empieza desde el registro y recorre la experiencia completa.</p>
    <form id="team-form">
      <label for="team-key">Clave del equipo</label>
      <input id="team-key" name="team-key" type="password" autocomplete="current-password" required aria-describedby="error" maxlength="512">
      <button id="submit" type="submit">Entrar a la prueba</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
    <p class="note">Este entorno es solo para pruebas del equipo. La experiencia de los miembros actuales continúa en la web habitual.</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var target = params.get('next') || '/biblioteca/inicio/';
      try {
        var url = new URL(target, window.location.origin);
        if (url.origin !== window.location.origin || !/^\/(biblioteca|r)\//.test(url.pathname) || url.pathname.indexOf('/biblioteca/equipo') === 0) throw new Error('Destino inválido');
        target = url.pathname + url.search + url.hash;
      } catch (_) { target = '/biblioteca/inicio/'; }
      document.getElementById('team-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        var button = document.getElementById('submit');
        var error = document.getElementById('error');
        button.disabled = true;
        button.textContent = 'Abriendo…';
        error.textContent = '';
        try {
          var response = await fetch('/api/genesis/team-access', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.getElementById('team-key').value})});
          var data = await response.json();
          if (!response.ok) throw new Error(data.error || 'No se pudo abrir el acceso');
          document.getElementById('team-key').value = '';
          window.location.replace(target);
        } catch (failure) {
          error.textContent = failure.message || 'Revisa tu conexión e inténtalo otra vez.';
          button.disabled = false;
          button.textContent = 'Entrar a la prueba';
        }
      });
    })();
  </script>
</body>
</html>
