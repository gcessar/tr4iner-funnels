<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://metodo.tr4iner.com/redirectionutmstr4iner2">
  <title>Continuando a tu sesión · TR4INER</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4efe6; color: #16130e; }
    main { padding: 24px; text-align: center; }
    p { margin: 0; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <p>Preparando tu siguiente paso…</p>
    <noscript><p>Activa JavaScript para continuar.</p></noscript>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      const campaign = urlParams.get("utm_campaign");
      const isVa = campaign === "TR4INER-VA" || campaign === "CASOS-VA";
      const destination = isVa ? "/calendly-va" : "/calendly-an";

      window.location.replace(window.location.origin + destination + queryString);
    });
  </script>
</body>
</html>
