<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://metodo.tr4iner.com/redirectionutmstr4iner2">
  <title>Continuando a tu sesión · TR4INER</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4efe6; color: #16130e; }
    main { padding: 24px; text-align: center; }
    p { margin: 0; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <p>Preparando tu siguiente paso…</p>
    <noscript><p>Activa JavaScript para continuar.</p></noscript>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);

      // Misma definición de "tráfico VA" que ya aplican /redirectfit4 y /fit4.
      // Antes se comparaba utm_campaign contra dos valores exactos, y cualquier
      // otro texto mandaba a la agenda de Anthoni a un lead de Veronika: el
      // respaldo ROSITA-VA de /testimonio-rosita-va, que viaja cuando el enlace
      // llega sin UTMs, y cualquier campaña propia que ella estrene.
      // Typeform sólo reenvía las cinco UTMs, así que funnel/funnel_variant casi
      // nunca llegan hasta acá; se leen igual porque el puente también se abre
      // desde enlaces directos que sí los traen.
      const campaign = (urlParams.get("utm_campaign") || "").trim().toUpperCase();
      const funnel = (urlParams.get("funnel") || "").trim().toUpperCase();
      const funnelVariant = (urlParams.get("funnel_variant") || "").trim();
      const vaMarker = /(^|[-_])VA($|[-_])/i;

      const isVa = campaign === "TR4INER-VA" ||
        campaign === "CASOS-VA" ||
        funnel === "VA" ||
        vaMarker.test(funnelVariant) ||
        Array.from(urlParams.entries()).some(function (entry) {
          return entry[0].toLowerCase().indexOf("utm_") === 0 && vaMarker.test(entry[1]);
        });

      // Agenda en pausa desde el 26-sep-2026: Martin no está disponible hasta el
      // lunes y nadie puede tomar las llamadas. Mientras tanto, los calificados
      // van al WhatsApp de ManyChat de su cuenta, con los mismos números y
      // textos que /redirectionutmstr4iner, así ManyChat los recibe igual que
      // siempre. Para volver a Calendly basta con pasar esto a false.
      const AGENDA_PAUSADA = true;

      if (!AGENDA_PAUSADA) {
        const destination = isVa ? "/calendly-va" : "/calendly-an";
        window.location.replace(window.location.origin + destination + queryString);
        return;
      }

      const isMetaCaseStudy = !isVa &&
        urlParams.get("utm_source") === "MetaAds" &&
        urlParams.get("utm_medium") === "Caso_Estudio";
      const phone = isVa ? "15677024560" : "17439014239";
      const message = isMetaCaseStudy
        ? "¡Hola! Quiero más información."
        : "Hola! Necesito ayuda con mi transformacion fisica y buscaba conocer mas sobre los programas que ofrece Tr4iner.";

      window.location.replace(
        "https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodeURIComponent(message)
      );
    });
  </script>
</body>
</html>
