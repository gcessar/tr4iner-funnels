      un enlace que YA trae UTMs. Recorrer la query sobrescribiendo cada clave
      con su última aparición hacía que el registro llegara con `utm_source=ig`
      y se perdiera la nomenclatura original (incidente del 22-jul-2026).
      Se consolida ANTES de GTM para que analítica, webhook y redirect lean la
      misma query: gana el primer valor no vacío de cada dato de atribución.
    */
    (function () {
      var raw = new URLSearchParams(window.location.search);
      var canonical = new URLSearchParams();
      var hadDuplicates = false;
      var attributionKeys = ["fbclid", "gclid", "fbc_id", "h_ad_id"];

      raw.forEach(function (value, key) {
        var isAttribution = key.indexOf("utm_") === 0 || attributionKeys.indexOf(key) !== -1;
        if (!isAttribution) {
          canonical.append(key, value);
          return;
        }
        if (!canonical.has(key)) {
          canonical.set(key, value);
          return;
        }
        hadDuplicates = true;
        if (!canonical.get(key) && value) canonical.set(key, value);
      });

      if (!hadDuplicates) return;
      var query = canonical.toString();
      var cleanUrl = window.location.pathname + (query ? "?" + query : "") + window.location.hash;
      window.history.replaceState(window.history.state, "", cleanUrl);
    })();

    :root {
      /* Paleta del prototipo aprobado el 19-sep. */
      --bg: #fdf6f0;
      --panel: #ffffff;
      --ink: #141414;
      --muted: #8a8a8a;
      --muted-strong: #5b5b5b;
      --rose: #e8b48f;
      --rose-deep: #ce9268;
      --rose-tint: #fbefe5;
      --field-bg: #ffffff;
      --field-border: #e4e4e4;
      --field-border-soft: #efd9c6;
      --soft: #f7f7f5;
      --line: #eaeaea;
      --on-accent: #141414;
      --error: #b4402f;
      --body: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-width: 320px;
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; color: inherit; }

    button, a {
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(232, 180, 143, .25);
    }

    a { color: var(--rose); text-decoration: none; }
    a:hover { color: var(--rose-deep); }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--rose-deep);
      outline-offset: 3px;
    }

    ::selection { background: rgba(232, 180, 143, .35); }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--ink);
      color: var(--panel);
      font-weight: 600;
      text-decoration: none;
      transform: translateY(-180%);
    }

    .skip-link:focus { transform: none; }

    .split {
      display: grid;
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 40px 40px;
      align-items: start;
      gap: 40px;
      grid-template-columns: minmax(0, 1fr) 400px;
    }

    .casos { min-width: 0; }

    .h1 {
      max-width: 22ch;
      margin: 18px 0 0;
      font-size: clamp(1.5rem, 2.6vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.2;
      text-transform: uppercase;
      text-wrap: pretty;
    }

    .h1 .accent { color: var(--rose); }
    .dl { display: block; }

    /* Carrusel: en escritorio se desplaza con las flechas; en móvil el CSS lo
       convierte en una grilla de tres y las tarjetas se tocan directamente. */
    .carwrap {
      position: relative;
      overflow: hidden;
      max-width: 560px;
      margin: 22px auto 0;
    }

    .cartrack {
      display: flex;
      gap: 14px;
      padding: 6px 12px 18px;
      list-style: none;
      transition: transform .45s cubic-bezier(.4, .1, .2, 1);
    }

    .cartrack li { flex: 0 0 200px; }

    .caso {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      opacity: .5;
      transform: scale(.92);
      transition: opacity .35s, transform .35s;
    }

    .caso[aria-pressed="true"] { opacity: 1; transform: scale(1.12); }

    /* `display: block` no es cosmético: son <span> dentro del botón y, como
       cajas inline, el `outline` del caso activo se dibuja en pedazos. */
    .caso-foto {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: var(--soft);
    }

    .caso-foto img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .caso-nombre {
      display: block;
      margin: 12px 0 0;
      color: var(--ink);
      font-size: .95rem;
      font-weight: 500;
      text-align: center;
    }

    .carnav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 26px;
    }

    .navbtn {
      display: grid;
      width: 44px;
      height: 44px;
      border: 1.5px solid var(--field-border);
      border-radius: 50%;
      place-items: center;
      background: var(--panel);
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }

    .navbtn:hover { border-color: var(--rose); background: var(--soft); }
    .navbtn svg { width: 18px; height: 18px; }

    .carnav span {
      min-width: 110px;
      color: var(--muted-strong);
      font-size: .86rem;
      text-align: center;
    }

    /* Ficha del formulario */
    .fcard {
      width: 100%;
      max-width: 400px;
      min-width: 0;
      margin-top: 18px;
      padding: 22px 22px 24px;
      justify-self: end;
      border: 1px solid var(--line);
      border-top: 3px solid var(--rose);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 40px -30px rgba(20, 20, 20, .18);
    }

    .fcard-title {
      margin-bottom: 16px;
      color: #0c0c0c;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .opts {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .opt {
      display: flex;
      min-height: 78px;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border: 1.5px solid var(--field-border);
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      font-size: .76rem;
      font-weight: 400;
      line-height: 1.25;
      text-align: center;
      transition: background .2s, border-color .2s;
    }

    .opt:hover { border-color: var(--rose); }
    .opt[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-tint); }

    .flabel {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .fcard input {
      width: 100%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1.5px solid var(--field-border);
      border-radius: 10px;
      background: var(--field-bg);
      font-size: .98rem;
      transition: border-color .2s, box-shadow .2s;
    }

    .fcard input::placeholder { color: var(--muted); opacity: .75; }

    .fcard input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(232, 180, 143, .28);
      outline: 0;
    }

    .fcard input[aria-invalid="true"] { border-color: var(--error); }

    .field-error {
      display: none;
      margin: -8px 0 12px;
      color: var(--error);
      font-size: .8rem;
      line-height: 1.4;
    }

    .field-error.visible { display: block; }

    .honeypot {
      position: absolute !important;
      left: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
    }

    .submit {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-top: 4px;
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--rose);
      color: var(--on-accent);
      cursor: pointer;
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background .2s, transform .2s;
    }

    .submit:hover { transform: translateY(-2px); }
    .submit[disabled] { cursor: wait; opacity: .75; transform: none; }
    .submit svg { width: 17px; height: 17px; }

    .site-footer {
      padding: 34px 0 calc(34px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
    }

    .site-footer > div { max-width: 1180px; margin: 0 auto; padding: 0 40px; }

    .trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .trust img {
      display: block;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 50%;
      background: var(--soft);
      object-fit: cover;
    }

    .trust-text { text-align: left; line-height: 1.35; }

    .trust-label {
      display: block;
      color: var(--ink);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .trust-name { display: block; color: var(--muted); font-size: .82rem; }

    .site-footer p { margin: 5px 0; font-size: .84rem; }

    .legal {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 2px;
    }

    .legal a { border-bottom: 1px solid var(--line); }

    .noscript {
      max-width: 560px;
      margin: 0 auto 18px;
      padding: 12px 16px;
      border: 1px solid var(--field-border);
      border-radius: 12px;
      color: var(--muted-strong);
      font-size: .9rem;
      text-align: center;
    }

    @media (max-width: 1100px) {
      .split {
        justify-items: center;
        gap: 32px;
        grid-template-columns: 1fr;
      }
      .casos { width: 100%; max-width: 560px; }
      .fcard { justify-self: center; }
    }

    @media (max-width: 640px) {
      .split { padding: 28px 20px 40px; gap: 0; }

      .h1 {
        margin-top: 0;
        font-size: 1.55rem;
        line-height: 1.15;
      }

      .dl { display: inline; }

      /* Sin flechas: las tres quedan a la vista y se elige tocando. */
      .carwrap { max-width: none; overflow: visible; margin: 22px 0 0; }

      .cartrack {
        display: grid;
        padding: 0;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        transform: none !important;
      }

      .cartrack li { flex: none; min-width: 0; }

      .caso { opacity: .42; transform: none; }
      .caso[aria-pressed="true"] { opacity: 1; transform: none; }
      .caso[aria-pressed="true"] .caso-foto { outline: 2px solid var(--rose); outline-offset: 2px; }
      .caso-nombre { margin-top: 8px; font-size: .8rem; }

      .carnav { display: none; }

      .fcard {
        max-width: none;
        margin-top: 26px;
        padding: 22px 0 0;
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .opt { min-height: 56px; border-color: var(--field-border-soft); }
      .opt[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-tint); }

      .fcard input {
        padding: 14px;
        border-color: var(--field-border-soft);
        background: transparent;
        /* 16px exactos: con menos, iOS hace zoom al enfocar. */
        font-size: 16px;
      }

      .submit { min-height: 52px; }
      .site-footer > div { padding: 0 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

      <!-- Funnel de Veronika: la ruta es sólo para mujeres, igual que Rosita y
           Andrea VA. Por eso el sexo no se pregunta, se declara. -->
      <input type="hidden" name="sexo" value="Mujer" />

      <label class="flabel" for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Tu nombre"
        autocomplete="given-name"
        autocapitalize="words"
        enterkeyhint="next"
        maxlength="80"
        aria-describedby="nombre-error"
        aria-invalid="false"
      />
      <p class="field-error" id="nombre-error" role="alert"></p>

      <label class="flabel" for="correo">Correo electrónico</label>
      <input
        type="email"
        id="correo"
        name="correo"
        placeholder="tu@correo.com"
        autocomplete="email"
        inputmode="email"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="go"
        maxlength="120"
        aria-describedby="correo-error"
        aria-invalid="false"
      />
      <p class="field-error" id="correo-error" role="alert"></p>

      <button class="submit" id="submit" type="submit">
        <span>Quiero saber qué hacer</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>

      <noscript>
        <p class="noscript" style="margin-top:16px">Para registrarte necesitas activar JavaScript en tu navegador.</p>
      </noscript>
    </form>
  </main>

  <footer class="site-footer">
    <div>
      <div class="trust">
        <img src="/assets/va/vero-perfil-footer.webp" width="46" height="46" loading="lazy" decoding="async" alt="Veronika Alvarado" />
        <span class="trust-text">
          <span class="trust-label">Producción · TR4INER</span>
          <span class="trust-name">Veronika Alvarado · Coach</span>
        </span>
      </div>
      <p>© 2026 TR4INER · BodyMindFitCo LLC</p>
      <p class="legal">
        <a href="https://tr4iner.com/politica-de-privacidad/" target="_blank" rel="noopener">Privacidad</a>
        <a href="https://tr4iner.com/terminos-y-condiciones/" target="_blank" rel="noopener">Términos</a>
      </p>
    </div>
  </footer>

  <script src="/attribution.js"></script>
  <script>
    (function () {
      "use strict";

      var WEBHOOK = "https://primary-production-0efa.up.railway.app/webhook/casos-estudio";
      var FUNNEL_VARIANT = "casos-de-estudio-va";
      /*
        El caso que se elige decide a dónde sigue la persona. Flor tiene su VSL
        en la misma página de registro; Rosita y Andrea lo tienen en su ruta
        `/video`, así que el destino no es simétrico y se declara acá.
      */
      var CASOS = {
        flor:   { nombre: "Flor",   destino: "/testimonio-flor-va",          perfil: "Subo de peso y ya no me siento bien como antes" },
        rosita: { nombre: "Rosita", destino: "/testimonio-rosita-va/video",  perfil: "Entreno, cuido mi alimentación, pero no veo cambios" },
        andrea: { nombre: "Andrea", destino: "/testimonio-andrea-va/video",  perfil: "Logro bajar de peso, pero lo vuelvo a recuperar" }
      };
      var ORDEN = ["flor", "rosita", "andrea"];
      /* Respaldo de atribución cuando el enlace llega sin UTMs. `CASOS-VA` no es
         decorativo: las salidas del Typeform reconocen el tráfico de Veronika por
         el marcador `VA` en alguna UTM, y de eso depende que la persona termine
         en la agenda de ella y no en la de Anthoni. */
      var UTM_SOURCE_DIRECTO = "LANDING-VA-DIRECTO";
      var UTM_CAMPAIGN_DIRECTO = "CASOS-VA";
      var ESPERA_MAX_MS = 1500;

      var tr4 = window.TR4Track || {};
      var track = document.getElementById("cartrack");
      var contador = document.getElementById("contador");
      var tarjetas = Array.prototype.slice.call(document.querySelectorAll(".caso"));
      var opciones = Array.prototype.slice.call(document.querySelectorAll(".opt"));
      var form = document.getElementById("registro");
      var submit = document.getElementById("submit");
      var submitLabel = submit.querySelector("span");
      var nameInput = document.getElementById("nombre");
      var emailInput = document.getElementById("correo");
      var honeypot = document.getElementById("website");
      var indice = 0;
      var perfilElegido = "";
      var submitting = false;

      var dominiosFalsos = [
        "test.com", "ejemplo.com", "example.com", "fake.com", "temp.com",
        "mailinator.com", "guerrillamail.com", "yopmail.com", "trashmail.com",
        "throwam.com", "sharklasers.com", "guerrillamailblock.com", "grr.la",
        "spam4.me", "tempr.email", "dispostable.com", "spamgourmet.com"
      ];

      function casoActual() { return ORDEN[indice]; }

      function pintar() {
        var clave = casoActual();
        tarjetas.forEach(function (boton, i) {
          boton.setAttribute("aria-pressed", i === indice ? "true" : "false");
        });
        opciones.forEach(function (boton) {
          boton.setAttribute("aria-pressed", boton.dataset.caso === clave && perfilElegido ? "true" : "false");
        });
        contador.textContent = CASOS[clave].nombre + " · " + (indice + 1) + " / " + ORDEN.length;
        // El desplazamiento centra la tarjeta activa; en móvil el CSS lo anula.
        var ancho = track.parentNode.clientWidth || 560;
        track.style.transform = "translateX(" + (Math.min(ancho, 560) / 2 - (indice * 214 + 100) - 12) + "px)";
      }

      function elegir(clave, desdePerfil) {
        var i = ORDEN.indexOf(clave);
        if (i === -1) return;
        indice = i;
        if (desdePerfil) perfilElegido = CASOS[clave].perfil;
        pintar();
      }

      tarjetas.forEach(function (boton) {
        boton.addEventListener("click", function () { elegir(boton.dataset.caso, false); });
      });
      opciones.forEach(function (boton) {
        boton.addEventListener("click", function () { elegir(boton.dataset.caso, true); });
      });
      document.getElementById("prev").addEventListener("click", function () {
        indice = (indice - 1 + ORDEN.length) % ORDEN.length;
        pintar();
      });
      document.getElementById("next").addEventListener("click", function () {
        indice = (indice + 1) % ORDEN.length;
        pintar();
      });
      window.addEventListener("resize", pintar);
      pintar();

      function showError(input, errorId, message) {
        var error = document.getElementById(errorId);
        error.textContent = message || "";
        error.classList.toggle("visible", !!message);
        input.setAttribute("aria-invalid", message ? "true" : "false");
      }

      function emailIsValid(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);
      }

      function dominioSospechoso(email) {
        return dominiosFalsos.indexOf((email.split("@")[1] || "").toLowerCase()) !== -1;
      }

      function buildContext() {
        var all = tr4.getCanonicalParams
          ? tr4.getCanonicalParams()
          : new URLSearchParams(window.location.search);
        var tracked = tr4.getAttribution ? tr4.getAttribution() : {};

        Object.keys(tracked).forEach(function (key) {
          // fbc/fbp se reconstruyen en el mismo dominio; no se exponen en la URL.
          if (key === "fbc" || key === "fbp") return;
          if (!all.get(key) && tracked[key]) all.set(key, tracked[key]);
        });

        if (!all.get("utm_source")) all.set("utm_source", UTM_SOURCE_DIRECTO);
        if (!all.get("utm_campaign")) all.set("utm_campaign", UTM_CAMPAIGN_DIRECTO);
        all.set("funnel", "VA");
        all.set("funnel_variant", FUNNEL_VARIANT);

        return all;
      }

      function buildRedirect(clave, nombre, email, context) {
        // Mismo origen: el recorrido se queda dentro del deployment que se prueba.
        var target = new URL(CASOS[clave].destino, window.location.origin);
        var next = new URLSearchParams(context);
        next.set("first_name", nombre);
        next.set("name", nombre);
        next.set("email", email);
        next.set("sexo", "Mujer");
        next.set("caso", clave);
        // El `@` literal: Typeform y Calendly lo necesitan sin encodear.
        target.search = next.toString().replace(/%40/gi, "@");
        return target.toString();
      }

      nameInput.addEventListener("input", function () { showError(nameInput, "nombre-error", ""); });
      emailInput.addEventListener("input", function () { showError(emailInput, "correo-error", ""); });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (submitting || honeypot.value) return;

        var nombre = nameInput.value.trim();
        var email = emailInput.value.trim().toLowerCase();
        var errorEmail = !emailIsValid(email)
          ? "Ingresa un correo válido."
          : (dominioSospechoso(email) ? "Ingresa un correo real: ahí te llega el acceso." : "");

        showError(nameInput, "nombre-error", nombre ? "" : "Ingresa tu nombre.");
        showError(emailInput, "correo-error", errorEmail);
        if (!nombre || errorEmail) {
          (!nombre ? nameInput : emailInput).focus();
          return;
        }

        var clave = casoActual();
        submitting = true;
        submit.disabled = true;
        submit.setAttribute("aria-busy", "true");
        submitLabel.textContent = "Abriendo el caso…";

        var context = buildContext();
        var attribution = {};
        context.forEach(function (value, key) {
          if (!value) return;
          var esAtribucion = tr4.isAttributionKey
            ? tr4.isAttributionKey(key)
            : (key.indexOf("utm_") === 0 || ["fbclid", "gclid", "fbc_id", "h_ad_id"].indexOf(key) !== -1);
          if (esAtribucion && key !== "fbc" && key !== "fbp") attribution[key] = value;
        });

        var metaIds = tr4.getMetaIds ? tr4.getMetaIds() : {};
        var payload = {
          nombre: nombre,
          email: email,
          sexo: "Mujer",
          funnel: "casos-estudio-va",
          variant: "VA",
          // Qué eligió y a qué caso se fue: el CRM guarda el payload crudo, así
          // que esto queda disponible aunque hoy nadie lo mapee.
          caso: clave,
          perfil: perfilElegido || null,
          video: context.get("video") || null,
          utm: attribution,
          // Los ids de Meta van al ras del payload porque el CRM los guarda en
          // columnas propias de `OptIn`.
          fbc: metaIds.fbc || null,
          fbp: metaIds.fbp || null,
          page_url: window.location.href,
          timestamp: new Date().toISOString()
        };
        var redirect = buildRedirect(clave, nombre, email, context);

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: "va_registration_submitted",
          funnel_variant: FUNNEL_VARIANT,
          sexo: "Mujer",
          caso: clave
        });

        // Copia de seguridad directa al CRM, en paralelo al webhook de n8n: si
        // n8n se cae, el sheet y Brevo se pierden juntos y esta es la única
        // copia que queda. Ya usa keepalive adentro y nunca bloquea.
        if (tr4.saveOptIn) tr4.saveOptIn(payload);

        var navegado = false;
        function irAlCaso() {
          if (navegado) return;
          navegado = true;
          window.location.assign(redirect);
        }

        try {
          fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            // keepalive: el navegador termina el POST aunque ya estemos navegando.
            keepalive: true
          }).then(irAlCaso).catch(irAlCaso);
        } catch (err) {
          irAlCaso();
        }

        window.setTimeout(irAlCaso, ESPERA_MAX_MS);
      });
    })();
  </script>
</body>
