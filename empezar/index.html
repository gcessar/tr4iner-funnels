      Instagram puede agregar sus propios UTMs a un enlace que ya los trae.
      Normalizamos antes de GTM para que analítica, los enlaces de pago y la
      cita de Calendly lean una sola fuente: gana el primer valor no vacío.
    */
    (function () {

      var canonical = new URLSearchParams();
      var hadDuplicates = false;
      var attributionKeys = ["fbclid", "gclid", "fbc_id", "h_ad_id"];

      raw.forEach(function (value, key) {
        var isAttribution = key.indexOf("utm_") === 0 || attributionKeys.indexOf(key) !== -1;
        if (!isAttribution) {
          canonical.append(key, value);
          return;
        }
        if (!canonical.has(key)) {
          canonical.set(key, value);
          return;
        }
        hadDuplicates = true;
        if (!canonical.get(key) && value) canonical.set(key, value);
      });

      if (!hadDuplicates) return;
      var query = canonical.toString();
      var cleanUrl = window.location.pathname + (query ? "?" + query : "") + window.location.hash;
      window.history.replaceState(window.history.state, "", cleanUrl);
    })();

  <style>
    :root {
      --ink: #16181A;
      --ink-soft: #575F67;
      /* Grises recalculados contra la superficie #F2F3F5: #636A71 da 4,94:1. */
      --muted: #636A71;
      --rule: #DDE1E5;
      /* El óxido de la familia (#A85E40) da 4,36:1 sobre #F2F3F5 y los rótulos de 10 px
         piden 4,5: un punto más oscuro llega a 4,88 sin cambiar el tono. */
      --rust: #9E5738;
      --yellow: #F5C518;
      --cream: #F5F1E5;
      --paper: #FFFFFF;
      --error: #A1261C;
      /* Superficie única, como /calendly-an y los testimonios: los bloques se separan
         por aire y las placas se despegan del fondo sólo con luz y sombra. */
      --surface: #F2F3F5;
      --neu-dark: rgba(32, 41, 52, 0.15);
      --neu-dark-soft: rgba(32, 41, 52, 0.10);
      --neu-light: #FFFFFF;
      --radius-plate: 26px;
      --radius-soft: 16px;
      --gutter: clamp(14px, 4vw, 28px);
      --serif: "Stack Sans Headline", -apple-system, "Helvetica Neue", sans-serif;
      --sans: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      /* Nombres que usa la hoja de países de prefijo-pais.js. */
      --body: var(--sans);
      --mark-strong: var(--yellow);
    }

    /* Ni Stack Sans Headline ni Lexend traen itálica: el énfasis lo llevan el color y el peso. */
    em, i { font-style: normal; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }
    html.agenda-abierta, html.agenda-abierta body { overflow: hidden; }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a, button { touch-action: manipulation; }
    button, input, textarea { font: inherit; color: inherit; }

    a:focus-visible,
    button:focus-visible,
    .control:focus-visible {
      outline: 2px solid var(--rust);
      outline-offset: 3px;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) var(--gutter) calc(40px + env(safe-area-inset-bottom));
    }

    /* ── Video ─────────────────────────────────────────── */
    .video-card {
      max-width: 780px;
      margin: 0 auto;
      padding: 10px;
      border-radius: var(--radius-plate);
      background: var(--surface);
      box-shadow: 14px 14px 32px var(--neu-dark), -14px -14px 32px var(--neu-light);
    }

    /* aspect-ratio reserva el alto antes de que Vidalytics inserte nada (CLS 0). */
    .video-container {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: calc(var(--radius-plate) - 10px);
      background: #111;
      isolation: isolate;
    }

    .video-container > div {
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
      padding-top: 0 !important;
    }

    /* Portada propia encima del reproductor: es el LCP y pinta el primer cuadro del video
       al instante. Se va cuando Vidalytics ya está mostrando el suyo. */
    .vsl-portada {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: #111;
      cursor: pointer;
      transition: opacity 260ms ease;
    }

    .vsl-portada img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .vsl-portada.saliendo { opacity: 0; pointer-events: none; }

    .vsl-aviso {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px 12px 14px;
      border-radius: 12px;
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      transform: translate(-50%, -50%);
      text-align: left;
      white-space: nowrap;
    }

    .vsl-aviso svg { width: 26px; height: 26px; flex: 0 0 auto; }
    .vsl-aviso small { display: block; font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    .vsl-aviso strong { display: block; font-size: 16px; font-weight: 500; line-height: 1.15; }
    .vsl-portada.cargando .vsl-aviso { animation: latido 700ms ease-in-out infinite alternate; }

    /* ── Pie ───────────────────────────────────────────── */
    .trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: clamp(56px, 10vw, 88px);
    }

    .trust-avatar {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 50%;
      box-shadow: 5px 5px 12px var(--neu-dark-soft), -5px -5px 12px var(--neu-light);
    }

    .trust-avatar img { display: block; width: 46px; height: 46px; object-fit: cover; }

    .trust-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9.5px;
      line-height: 1.25;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .trust-name { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
    .trust-name .sub { color: var(--muted); font-weight: 400; }

    .fine-print {
      margin-top: 30px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9.5px;
      line-height: 1.8;
      letter-spacing: 0.1em;
      text-align: center;
      text-transform: uppercase;
    }

    .fine-print a { color: var(--muted); text-decoration: none; }
    .fine-print a:hover { color: var(--ink); }
    .fine-print .divider { margin: 0 8px; }

    /* ── Escritorio ────────────────────────────────────── */
    @media (min-width: 760px) {
      .page { padding-top: calc(clamp(28px, 5vw, 56px) + env(safe-area-inset-top)); }
      .video-card { padding: 12px; box-shadow: 20px 20px 44px var(--neu-dark), -20px -20px 44px var(--neu-light); }
      .video-container { border-radius: calc(var(--radius-plate) - 12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

        if (hecho) fn();

      EVENTOS.forEach(function (evento) { window.addEventListener(evento, despertar, { passive: true }); });
