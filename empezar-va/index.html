  <script>
    (function () {
      "use strict";

      /*
        Formulario «FORM VA» (niqtWgJp): se usa SÓLO en esta página, así que
        cada respuesta suya es de /empezar-va y el CRM la cuenta sin marcador.
        No hay registro previo: la única llave hacia la venta es el teléfono

      */
      var FORM_ID = "niqtWgJp";
      var VARIANT = "empezar-va";

      var params = new URLSearchParams(window.location.search);
      var tracked = window.TR4Track && window.TR4Track.getAttribution
        ? window.TR4Track.getAttribution()
        : {};
      var typeformLoaded = false;
      var tf = document.getElementById("tf-embed");
      var loader = document.getElementById("form-loader");
      var frame = document.querySelector(".typeform-frame");

      Object.keys(tracked).forEach(function (key) {
        if (!params.has(key) && tracked[key]) params.set(key, tracked[key]);
      });

      // Typeform sólo reenvía las UTMs: el `-VA` tiene que viajar en alguna de
      // ellas para que el CRM y los puentes reconozcan a Veronika.
      if (!params.get("utm_source")) params.set("utm_source", "EMPEZAR-VA-DIRECTO");
      if (!params.get("utm_campaign")) params.set("utm_campaign", "EMPEZAR-VA");

      function buildHiddenFields() {
        // Los mismos nombres que el formulario declara como ocultos. Typeform
        // descarta en silencio cualquier otro, así que agregar uno acá sin
        // declararlo allá no sirve de nada.
        var declared = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "video", "variant"];
        var limpiar = window.TR4Track && window.TR4Track.decodeUtmValue
          ? window.TR4Track.decodeUtmValue
          : function (v) { return v; };
        var hidden = {};

        declared.forEach(function (key) {
          var value = params.get(key);
          // El SDK codifica cada valor por su cuenta: acá van en crudo para que
          // espacios, tildes y emojis lleguen enteros.
          if (value) hidden[key] = limpiar(value);
        });

        // fbc/fbp se toman del dominio actual; no se inventan ni se sustituyen por IDs externos.
        var metaIds = window.TR4Track && window.TR4Track.getMetaIds
          ? window.TR4Track.getMetaIds()
          : {};
        Object.keys(metaIds).forEach(function (key) {
          if (metaIds[key]) hidden[key] = metaIds[key];
        });

        return hidden;
      }

      function mountTypeform() {
        if (!window.tf || !window.tf.createWidget || !tf) return;
        window.tf.createWidget(FORM_ID, {
          container: tf,
          hideHeaders: true,
          // Evita que un swipe al scrollear la página salte de pregunta.
          disableScroll: true,
          inlineOnMobile: true,
          // Booleano, sin "min,max": el alto sigue a la pregunta y las que tienen
          // muchas opciones dejan de cortar el botón de continuar.
          autoResize: true,
          // GA4 va centralizado en GTM, no compartido con el embed.
          shareGaInstance: false,
          // El final del formulario abre WhatsApp: tiene que navegar esta
          // página, no el iframe, donde WhatsApp no carga.
          redirectTarget: "_parent",
          hidden: buildHiddenFields(),
          onReady: function () {
            var iframe = tf.querySelector("iframe");
            if (iframe) iframe.title = "Evaluación TR4INER · Veronika Alvarado";
            if (loader) loader.style.display = "none";
          },
          onSubmit: function () {
            window.dataLayer.push({ event: "empezar_va_submit", funnel_variant: VARIANT });
          }
        });
      }

      function loadTypeform() {
        if (typeformLoaded) return;
        typeformLoaded = true;

        if (window.tf && window.tf.createWidget) {
          mountTypeform();
          return;
        }

        var script = document.createElement("script");
        script.src = "https://embed.typeform.com/next/embed.js";
        script.async = true;
        script.onload = mountTypeform;
        script.onerror = function () {
          if (loader) loader.textContent = "No pudimos cargar la evaluación. Recarga la página para intentarlo otra vez.";
        };
        document.head.appendChild(script);
      }

      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: "empezar_va_view", funnel_variant: VARIANT });

      if (params.get("tf_debug") === "1" || !("IntersectionObserver" in window)) {
        loadTypeform();
      } else {
        // Se precarga un scroll antes de llegar, para no dejar a nadie mirando
        // el «Cargando evaluación…».
        var observer = new IntersectionObserver(function (entries) {
          if (!entries.some(function (entry) { return entry.isIntersecting; })) return;
          observer.disconnect();
          loadTypeform();
        }, { rootMargin: "1200px 0px" });
        observer.observe(frame);

        // Red de seguridad: si alguien se queda viendo el VSL sin scrollear, el form
        // igual queda listo para cuando baje.
        setTimeout(loadTypeform, 6000);
      }

  <script>
    /*
      Aparición suave del segundo bloque, portada del diseño de Claude Design.
      Además del IntersectionObserver hay un barrido cada 400 ms: si alguien
      salta con el ancla o el navegador no dispara el observer, nada queda
      invisible.
    */
    (function () {
      "use strict";
      var els = Array.prototype.slice.call(document.querySelectorAll("[data-reveal]"));
      if (!els.length) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
      function show(el) { el.classList.remove("rv-armed"); el.classList.add("rv-in"); }
      els.forEach(function (el) { el.classList.add("rv-armed"); });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.style.animationDelay = (Math.max(els.indexOf(entry.target), 0) % 4) * 260 + "ms";
          show(entry.target);
          io.unobserve(entry.target);
        });
      }, { threshold: 0, rootMargin: "0px 0px -14% 0px" });
      els.forEach(function (el) { io.observe(el); });
      var sweep = window.setInterval(function () {
        var pend = els.filter(function (el) { return !el.classList.contains("rv-in"); });
        pend.forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.top < window.innerHeight * 0.86 && r.bottom > 0) show(el);
        });
        if (!pend.length) window.clearInterval(sweep);
      }, 400);
    })();
